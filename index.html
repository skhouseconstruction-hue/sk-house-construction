<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#082b5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SK House Construction</title>
<link rel="icon" type="image/jpeg" href="logo.jpg">
<link rel="apple-touch-icon" href="logo.jpg">
<meta name="application-name" content="SK House Construction">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="cloud.js"></script>
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand"><img src="logo.jpg" alt="SK House Construction"><div>SK House Construction</div></div>
    <button class="nav active" data-view="dashboard">⌂ <span>Inicio</span></button>
    <button class="nav" data-view="quote">▣ <span>Cotizaciones</span></button>
    <button class="nav" data-view="note">▤ <span>Notas de Venta</span></button>
    <button class="nav" data-view="clients">♙ <span>Clientes</span></button>
    <button class="nav" data-view="products">◈ <span>Productos / Servicios</span></button>
    <button class="nav" data-view="history">◷ <span>Historial</span></button>
    <button class="nav" data-view="settings">⚙ <span>Configuración</span></button>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="mobile-brand"><img src="logo.jpg" alt=""><strong>SK House Construction</strong></div>
      <div class="top-actions">
        <button class="btn outline" onclick="state.view='settings';render()">⚙ Mis datos</button>
        <button class="btn primary" onclick="newDocument('quote')">＋ Nueva Cotización</button>
        <button class="btn gold" onclick="newDocument('note')">＋ Nota de Venta</button>
      </div>
    </header>
    <section id="content"></section>
  </main>
</div>

<div id="toast" class="toast"></div>
<div id="modal" class="modal hidden"></div>
<script src="app.js"></script>
</body>
</html>
